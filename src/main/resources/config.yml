# ================================
# LABCLAIMS - KONFIGURACJA
# System Dzialek dla LabMC.pl
# ================================

# Ustawienia tierow dzialek
tiers:
  1:
    block: YELLOW_GLAZED_TERRACOTTA
    name: "&e&lDzialka Tier 1"
    size: 16  # 16x16 (1 chunk)
    price: 1000.0
    
  2:
    block: LIME_GLAZED_TERRACOTTA
    name: "&a&lDzialka Tier 2"
    size: 32  # 32x32 (4 chunki)
    price: 5000.0
    
  3:
    block: LIGHT_BLUE_GLAZED_TERRACOTTA
    name: "&b&lDzialka Tier 3"
    size: 64  # 64x64 (16 chunkow)
    price: 15000.0
    
  4:
    block: MAGENTA_GLAZED_TERRACOTTA
    name: "&d&lDzialka Tier 4"
    size: 128  # 128x128 (64 chunki)
    price: 50000.0
    
  5:
    block: RED_GLAZED_TERRACOTTA
    name: "&c&lDzialka Tier 5"
    size: 256  # 256x256 (256 chunkow)
    price: 150000.0

# Domyslne ustawienia nowej dzialki
defaults:
  pvp-enabled: false
  mob-spawning: true
  show-particles: true
  claim-name: "Dzialka gracza %player%"

# Ochrona dzialek
protection:
  block-break: true
  block-place: true
  block-interact: true  # Drzwi, lever, button, chest
  explosions: true  # Creeper, TNT
  entity-damage: true  # Ochrona zwierzat
  
  # Bloki ktorych nie mozna uzywac
  protected-interactions:
    - CHEST
    - BARREL
    - FURNACE
    - CRAFTING_TABLE
    - DOOR
    - TRAPDOOR
    - LEVER
    - BUTTON
    - HOPPER

# Hologram nad claim blockiem
hologram:
  enabled: true
  height: 2.5  # Jak wysoko nad blockiem
  lines:
    - "&7&m-------------------"
    - "%claim_name%"
    - "&7Wlasciciel: &f%owner%"
    - "&7Tier: %tier%"
    - "&7Rozmiar: &f%size%x%size%"
    - "&7&m-------------------"

# Particles na granicach (gdy wlaczone)
particles:
  type: REDSTONE  # Typ czasteczek
  color:
    red: 255
    green: 0
    blue: 255
  density: 20  # Ile czasteczek na bok
  height-interval: 5  # Co ile blokow w gore

# Wiadomosci
messages:
  prefix: "&d[&5LabClaims&d] &f"
  
  claim-created: "&aDzialka zostala utworzona!"
  claim-upgraded: "&aDzialka zostala ulepszona do tier %tier%!"
  claim-removed: "&cDzialka zostala usunieta!"
  claim-renamed: "&aNazwa dzialki zmieniona na: &f%name%"
  
  not-enough-money: "&cNie masz wystarczajaco pieniedzy! Potrzeba: &e%price%$"
  claim-limit-reached: "&cOsiagnales limit dzialek! (%current%/%max%)"
  claim-overlap: "&cTutaj juz jest czyjas dzialka!"
  not-in-claim: "&cNie stoisz na dzialce!"
  not-claim-owner: "&cTo nie jest twoja dzialka!"
  
  player-trusted: "&aGracz &f%player% &azostal dodany do dzialki!"
  player-untrusted: "&cGracz &f%player% &czostal usuniety z dzialki!"
  already-trusted: "&cTen gracz juz ma dostep!"
  not-trusted: "&cTen gracz nie ma dostepu!"
  
  entered-claim: "&aDzialka: &f%name% &7(Wlasciciel: &f%owner%&7)"
  left-claim: "&7Opusciles dzialke"
  
  protection-message: "&cTa dzialka jest chroniona!"
  no-permission: "&cNie masz uprawnien!"
  player-not-found: "&cGracz nie znaleziony!"
  
  pvp-enabled: "&aPvP zostalo &awlaczone&a!"
  pvp-disabled: "&cPvP zostalo &cwylaczone&c!"
  mob-spawning-enabled: "&aSpawn mobow zostal &awlaczony&a!"
  mob-spawning-disabled: "&cSpawn mobow zostal &cwylaczony&c!"
  particles-enabled: "&aCzasteczki zostaly &awlaczone&a!"
  particles-disabled: "&cCzasteczki zostaly &cwylaczone&c!"

# GUI - Panel Dzialki
gui:
  main-menu:
    title: "&5&lLabClaims &8» &dTwoje Dzialki"
    size: 54
    
  claim-panel:
    title: "&5&lPanel Dzialki &8» &d%claim_name%"
    size: 54
    
  admin-panel:
    title: "&c&lPanel Admina &8» &4Wszystkie Dzialki"
    size: 54
  
  trust-list:
    title: "&5&lZaufani Gracze &8» &d%claim_name%"
    size: 54
  
  # Ikony w GUI
  icons:
    claim-info:
      material: PLAYER_HEAD
      name: "&d&l%claim_name%"
      lore:
        - "&7Wlasciciel: &f%owner%"
        - "&7Tier: &f%tier%"
        - "&7Rozmiar: &f%size%x%size%"
        - "&7Lokalizacja: &f%location%"
        - ""
        - "&eKliknij aby otworzyc panel!"
    
    upgrade:
      material: EXPERIENCE_BOTTLE
      name: "&a&lUlepsz Dzialke"
      lore:
        - "&7Obecny tier: &f%current_tier%"
        - "&7Nastepny tier: &f%next_tier%"
        - "&7Koszt: &e%price%$"
        - "&7Nowy rozmiar: &f%next_size%x%next_size%"
        - ""
        - "&aKliknij aby ulepszyc!"
    
    max-tier:
      material: BARRIER
      name: "&c&lMaksymalny Tier"
      lore:
        - "&7Twoja dzialka jest na"
        - "&7najwyzszym tierze!"
    
    rename:
      material: NAME_TAG
      name: "&e&lZmien Nazwe"
      lore:
        - "&7Obecna nazwa:"
        - "&f%claim_name%"
        - ""
        - "&eWpisz na czacie nowa nazwe!"
        - "&7(Anuluj wpisujac 'cancel')"
    
    pvp-toggle:
      enabled:
        material: DIAMOND_SWORD
        name: "&a&lPvP: WLACZONE"
        lore:
          - "&7Gracze moga sie atakowac"
          - "&7na tej dzialce"
          - ""
          - "&cKliknij aby wylaczyc"
      disabled:
        material: WOODEN_SWORD
        name: "&c&lPvP: WYLACZONE"
        lore:
          - "&7Gracze nie moga sie atakowac"
          - "&7na tej dzialce"
          - ""
          - "&aKliknij aby wlaczyc"
    
    mob-spawning-toggle:
      enabled:
        material: ZOMBIE_HEAD
        name: "&a&lSpawn Mobow: WLACZONY"
        lore:
          - "&7Moby moga sie spawnic"
          - "&7na tej dzialce"
          - ""
          - "&cKliknij aby wylaczyc"
      disabled:
        material: SKELETON_SKULL
        name: "&c&lSpawn Mobow: WYLACZONY"
        lore:
          - "&7Moby nie moga sie spawnic"
          - "&7na tej dzialce"
          - ""
          - "&aKliknij aby wlaczyc"
    
    particles-toggle:
      enabled:
        material: BLAZE_POWDER
        name: "&a&lCzasteczki: WLACZONE"
        lore:
          - "&7Granice dzialki sa widoczne"
          - ""
          - "&cKliknij aby wylaczyc"
      disabled:
        material: GUNPOWDER
        name: "&c&lCzasteczki: WYLACZONE"
        lore:
          - "&7Granice dzialki sa niewidoczne"
          - ""
          - "&aKliknij aby wlaczyc"
    
    trust-manage:
      material: WRITABLE_BOOK
      name: "&b&lZarzadzaj Zaufanymi"
      lore:
        - "&7Zaufani gracze: &f%trust_count%"
        - ""
        - "&eKliknij aby otworzyc liste!"
    
    trust-player:
      material: PLAYER_HEAD
      name: "&f%player%"
      lore:
        - "&7Status: &aZaufany"
        - ""
        - "&cKliknij aby usunac!"
    
    add-trust:
      material: LIME_DYE
      name: "&a&lDodaj Gracza"
      lore:
        - "&7Wpisz nick gracza na czacie"
        - "&7aby dodac go do dzialki"
        - ""
        - "&7(Anuluj wpisujac 'cancel')"
    
    remove-claim:
      material: TNT
      name: "&c&lUsun Dzialke"
      lore:
        - "&4&lUWAGA!"
        - "&7To usunie dzialke na zawsze!"
        - "&7Nie otrzymasz zwrotu pieniedzy!"
        - ""
        - "&cKliknij aby potwierdzic!"
    
    confirm-remove:
      material: RED_CONCRETE
      name: "&4&lPOTWIERDZ USUNIECIE"
      lore:
        - "&cCzy na pewno chcesz usunac"
        - "&cte dzialke?"
        - ""
        - "&4KLIKNIJ ABY POTWIERDZIC"
    
    back:
      material: ARROW
      name: "&e&lPowrot"
      lore:
        - "&7Kliknij aby wrocic"
    
    close:
      material: BARRIER
      name: "&c&lZamknij"
      lore:
        - "&7Kliknij aby zamknac"
    
    filler:
      material: GRAY_STAINED_GLASS_PANE
      name: " "

# Dzwieki
sounds:
  claim-created:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.0
  
  claim-upgraded:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.5
  
  gui-click:
    sound: UI_BUTTON_CLICK
    volume: 0.5
    pitch: 1.0
  
  error:
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 1.0

# ================================
# INFORMACJE:
# - Rozmiary dzialek: 16, 32, 64, 128, 256
# - Ochrona od bedrocka do nieba (Y: -64 do 320)
# - Tylko bloki z enchantem dzialaja jako claim
# ================================
